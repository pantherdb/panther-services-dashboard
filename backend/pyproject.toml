[project]
name = "services-dashboard"
version = "0.1.0"
description = "Reads the PANTHER scoring services' API, nginx and Docker logs, joins them up, and serves the results to the dashboard."
requires-python = ">=3.13"
dependencies = [
    # The same pins as panther-scoring-services' API.
    "fastapi[standard-no-fastapi-cloud-cli]==0.162.0",
    "pydantic-settings==2.16.2",
]

[project.scripts]
services-dashboard = "services_dashboard.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.6"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S", "FAST"]
# The formatter keeps code to 100 columns; it doesn't split strings, and log lines in tests are long.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The sample is made-up traffic: a seeded PRNG is the point, not a security risk.
"src/services_dashboard/sample.py" = ["S311"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.fastapi]
entrypoint = "services_dashboard.main:app"
